# Include inside the martingreenwood.com Nginx server block.
#
# Vite fingerprints everything under /assets/, so these files can be cached
# for a year. The font filenames are stable project assets and use the same
# lifetime. `expires` is used instead of a location-level `add_header` so
# Forge's inherited security headers are preserved on older Nginx versions.

location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
}

location ^~ /fonts/ {
    expires 1y;
    try_files $uri =404;
}

# Public images outside Vite's fingerprinted asset directory remain mutable,
# but 30 days meets Lighthouse's efficient-cache threshold.
location ~* \.(?:avif|gif|ico|jpe?g|png|svg|webp)$ {
    expires 30d;
    try_files $uri =404;
}
