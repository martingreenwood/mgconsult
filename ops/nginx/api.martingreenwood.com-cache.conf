# Include inside the api.martingreenwood.com Nginx server block.
#
# Statamic assets retain their filenames when editors replace them, so use a
# 30-day cache rather than treating them as immutable. The frontend app adds
# the entry update timestamp to image URLs, providing immediate cache busting
# after a content update.

location ^~ /assets/ {
    expires 30d;
    try_files $uri =404;
}
